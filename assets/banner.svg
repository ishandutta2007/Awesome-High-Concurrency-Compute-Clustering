<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for drop shadow / glow -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.9; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translate(50px) rotate(0deg); }
      100% { transform: rotate(360deg) translate(50px) rotate(-360deg); }
    }
    .grid-bg {
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .data-stream {
      stroke-dasharray: 8, 8;
      animation: dashMove 4s linear infinite;
    }
    .data-stream-fast {
      stroke-dasharray: 6, 6;
      animation: dashMove 2.5s linear infinite;
    }
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 3s; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Dynamic Background Cluster Mesh / Graphs (Behind foreground text) -->
  <g class="grid-bg" opacity="0.5">
    <!-- Ambient ambient glow spots -->
    <circle cx="150" cy="180" r="160" fill="#0284c7" opacity="0.15" filter="url(#glowFilter)" />
    <circle cx="1050" cy="180" r="180" fill="#6366f1" opacity="0.18" filter="url(#glowFilter)" />
    <circle cx="600" cy="60" r="140" fill="#a855f7" opacity="0.12" filter="url(#glowFilter)" />
  </g>

  <!-- Left Side Dynamic Cluster Topology (Background) -->
  <g opacity="0.65">
    <!-- Interconnecting cluster lines -->
    <line x1="80" y1="100" x2="160" y2="160" stroke="#38bdf8" stroke-width="1.5" class="data-stream" />
    <line x1="160" y1="160" x2="90" y2="240" stroke="#818cf8" stroke-width="1.5" class="data-stream-fast" />
    <line x1="160" y1="160" x2="250" y2="130" stroke="#38bdf8" stroke-width="1.5" class="data-stream" />
    <line x1="160" y1="160" x2="230" y2="230" stroke="#c084fc" stroke-width="1.5" class="data-stream-fast" />
    <line x1="250" y1="130" x2="310" y2="190" stroke="#38bdf8" stroke-width="1.2" class="data-stream" />
    <line x1="230" y1="230" x2="310" y2="190" stroke="#818cf8" stroke-width="1.2" class="data-stream" />

    <!-- Cluster Nodes -->
    <circle cx="80" cy="100" r="7" fill="#0284c7" filter="url(#nodeGlow)" />
    <circle cx="80" cy="100" r="3" fill="#ffffff" />

    <circle cx="90" cy="240" r="7" fill="#6366f1" filter="url(#nodeGlow)" />
    <circle cx="90" cy="240" r="3" fill="#ffffff" />

    <circle cx="160" cy="160" r="11" fill="#38bdf8" class="pulse-node" filter="url(#nodeGlow)" />
    <circle cx="160" cy="160" r="5" fill="#ffffff" />

    <circle cx="250" cy="130" r="8" fill="#818cf8" filter="url(#nodeGlow)" />
    <circle cx="250" cy="130" r="3.5" fill="#ffffff" />

    <circle cx="230" cy="230" r="9" fill="#c084fc" filter="url(#nodeGlow)" />
    <circle cx="230" cy="230" r="4" fill="#ffffff" />

    <circle cx="310" cy="190" r="7" fill="#38bdf8" filter="url(#nodeGlow)" />
    <circle cx="310" cy="190" r="3" fill="#ffffff" />
  </g>

  <!-- Right Side Dynamic Cluster Topology (Background) -->
  <g opacity="0.65">
    <!-- Interconnecting cluster lines -->
    <line x1="1120" y1="100" x2="1040" y2="160" stroke="#c084fc" stroke-width="1.5" class="data-stream" />
    <line x1="1040" y1="160" x2="1110" y2="240" stroke="#38bdf8" stroke-width="1.5" class="data-stream-fast" />
    <line x1="1040" y1="160" x2="950" y2="130" stroke="#818cf8" stroke-width="1.5" class="data-stream" />
    <line x1="1040" y1="160" x2="970" y2="230" stroke="#38bdf8" stroke-width="1.5" class="data-stream-fast" />
    <line x1="950" y1="130" x2="890" y2="190" stroke="#c084fc" stroke-width="1.2" class="data-stream" />
    <line x1="970" y1="230" x2="890" y2="190" stroke="#818cf8" stroke-width="1.2" class="data-stream" />

    <!-- Cluster Nodes -->
    <circle cx="1120" cy="100" r="7" fill="#a855f7" filter="url(#nodeGlow)" />
    <circle cx="1120" cy="100" r="3" fill="#ffffff" />

    <circle cx="1110" cy="240" r="7" fill="#0284c7" filter="url(#nodeGlow)" />
    <circle cx="1110" cy="240" r="3" fill="#ffffff" />

    <circle cx="1040" cy="160" r="11" fill="#818cf8" class="pulse-node" filter="url(#nodeGlow)" />
    <circle cx="1040" cy="160" r="5" fill="#ffffff" />

    <circle cx="950" cy="130" r="8" fill="#38bdf8" filter="url(#nodeGlow)" />
    <circle cx="950" cy="130" r="3.5" fill="#ffffff" />

    <circle cx="970" cy="230" r="9" fill="#06b6d4" filter="url(#nodeGlow)" />
    <circle cx="970" cy="230" r="4" fill="#ffffff" />

    <circle cx="890" cy="190" r="7" fill="#c084fc" filter="url(#nodeGlow)" />
    <circle cx="890" cy="190" r="3" fill="#ffffff" />
  </g>

  <!-- Animated Floating Data Packets (Background) -->
  <g>
    <circle cx="480" cy="85" r="3" fill="#38bdf8" class="particle-1" filter="url(#nodeGlow)" />
    <circle cx="720" cy="75" r="3.5" fill="#818cf8" class="particle-2" filter="url(#nodeGlow)" />
    <circle cx="580" cy="295" r="3" fill="#c084fc" class="particle-3" filter="url(#nodeGlow)" />
  </g>

  <!-- Central Foreground Shield / Backdrop for clear text contrast -->
  <rect x="220" y="45" width="760" height="270" rx="18" fill="#090d16" fill-opacity="0.82" stroke="#334155" stroke-width="1.2" filter="url(#glowFilter)" />

  <!-- Top Pill Tag (Foreground) -->
  <g transform="translate(600, 85)">
    <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="-145" cy="0" r="4.5" fill="#38bdf8" class="pulse-node" />
    <text x="5" y="4.5" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" letter-spacing="1.2">
      HIGH-CONCURRENCY DISTRIBUTED COMPUTE
    </text>
  </g>

  <!-- Foreground Main Title -->
  <text class="title-text" x="600" y="160" text-anchor="middle" font-size="38" fill="url(#primaryGlow)">
    Awesome High-Concurrency Compute Clustering
  </text>

  <!-- Foreground Subtitle / Tagline -->
  <text class="subtitle-text" x="600" y="200" text-anchor="middle" font-size="16.5" fill="#e2e8f0">
    Elastic Compute Isolation • Distributed Query Processing • MPP &amp; Raft Engines
  </text>

  <!-- Feature Tags / Metric Cards (Foreground) -->
  <g transform="translate(600, 255)">
    <!-- Badge 1: 100k+ QPS -->
    <g transform="translate(-250, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="-1" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">THROUGHPUT</text>
      <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">100k+ QPS Scale</text>
    </g>

    <!-- Badge 2: Elastic Compute -->
    <g transform="translate(-80, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="0" y="-1" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ELASTICITY</text>
      <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Multi-Cluster Isolation</text>
    </g>

    <!-- Badge 3: Distributed Engines -->
    <g transform="translate(95, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <text x="0" y="-1" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">ARCHITECTURE</text>
      <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Shared-Data &amp; MPP</text>
    </g>

    <!-- Badge 4: Production Proven -->
    <g transform="translate(260, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="0" y="-1" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">DEPLOYMENT</text>
      <text x="0" y="12" text-anchor="middle" fill="#94a3b8" font-size="9.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Cloud &amp; Open Source</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGlow)" />
</svg>
